set -g default-terminal tmux-256color

set -ga terminal-features alacritty:RGB
set -ga terminal-features foot:RGB

set -g focus-events on
set -g mode-keys vi
set -g editor nvim
set -g default-shell /usr/bin/fish
set -g history-limit 10000
set -g automatic-rename off

set -g status-left "#{session_name}@#(uname -n) #{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"
set -g status-left-length 40

set -g status-right "#{?client_prefix, P,  } %m-%d %a %H:%M"
set -g status-right-length 20

set -g status-justify right

set -g window-status-format "#I#{?window_flags,#{window_flags}, }"
set -g window-status-current-format "#I#{?window_flags,#{window_flags}, }"

unbind C-b
set -g prefix C-j
bind C-j send-prefix

bind s choose-tree

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind v split-window -v -c "#{pane_current_path}"
bind b split-window -h -c "#{pane_current_path}"

bind Left resize-pane -L 10
bind Down resize-pane -D 10
bind Up resize-pane -U 10
bind Right resize-pane -R 10

bind Space copy-mode
bind [ choose-buffer
bind -T copy-mode-vi y send-keys -X copy-selection
